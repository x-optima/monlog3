# Узел warm: данные, к которым обращаются реже, чем к свежим журналам.

cluster.name: monlog3
node.name: es-warm

# Только уровень warm: узел не выбирает master и не принимает роль hot.
node.roles: [data_warm]

network.host: 0.0.0.0
http.port: 9200

discovery.seed_hosts: ["es-hot", "es-warm"]
cluster.initial_master_nodes: ["es-hot"]

xpack.security.enabled: false
xpack.security.enrollment.enabled: false
xpack.security.http.ssl.enabled: false
xpack.security.transport.ssl.enabled: false
xpack.ml.enabled: false

bootstrap.memory_lock: true
