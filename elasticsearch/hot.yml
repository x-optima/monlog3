# Узел hot: новые записи, системные индексы, единственный master в кластере.

cluster.name: monlog3
node.name: es-hot

# master — управление кластером.
# data_hot — свежие журналы (уровень hot).
# data_content — служебные и обычные индексы.
# ingest — конвейеры обработки при записи.
node.roles: [master, data_hot, data_content, ingest]

network.host: 0.0.0.0
http.port: 9200

discovery.seed_hosts: ["es-hot", "es-warm"]
cluster.initial_master_nodes: ["es-hot"]

# Учебный стенд без учётных записей и шифрования между узлами.
xpack.security.enabled: false
xpack.security.enrollment.enabled: false
xpack.security.http.ssl.enabled: false
xpack.security.transport.ssl.enabled: false
xpack.ml.enabled: false

bootstrap.memory_lock: true
