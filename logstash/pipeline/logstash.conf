# Конвейер Logstash: вход - разбор - запись в Elasticsearch.
# Два входа:
#   1) JSON по TCP — требование задания (порт 5000);
#   2) протокол Beats — так Filebeat передаёт журналы Docker (порт 5044).

input {
  tcp {
    port => 5000
    codec => json_lines
    type => "tcp-json"
  }

  beats {
    port => 5044
  }
}

filter {
  # Если строка журнала Docker сама является JSON, раскладываем её по полям.
  if [message] {
    json {
      source => "message"
      skip_on_invalid_json => true
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://es-hot:9200"]
    index => "logstash-%{+YYYY.MM.dd}"
    ssl_enabled => false
  }
}
